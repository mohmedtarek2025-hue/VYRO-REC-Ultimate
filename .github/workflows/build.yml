name: Build VYRO REC from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Detect and Extract Project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            mkdir -p temp_extracted
            unzip -q "$ZIP_FILE" -d temp_extracted
            cd temp_extracted
            PROJECT_ROOT=$(find . -name "gradlew" -maxdepth 3 -exec dirname {} \;)
            if [ -n "$PROJECT_ROOT" ]; then
              cd "$PROJECT_ROOT"
              cp -r . ..
              cd ..
            fi
            cd ..
          fi

      - name: Grant execute permission for Gradle
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            find . -name "gradlew" -exec chmod +x {} \;
          fi

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VYRO-REC-Ultimate-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
